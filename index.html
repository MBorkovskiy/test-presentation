  <div class="rule"></div>
  <p class="lead">Замедлиться, отдохнуть от города, вкусно поесть и восстановить силы на берегу самого большого озера Подмосковья.</p>

  <p>Рядом бренды, близкие гостю отеля. Каждый встроен в программу отдыха, а не стоит на стенде.</p>
